<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - بوابة الدفع</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Tahoma', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            direction: rtl;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 400px;
            padding: 40px;
        }
        .icon { text-align: center; font-size: 60px; margin-bottom: 20px; }
        h2 { text-align: center; color: #333; margin-bottom: 30px; }
        .tabs {
            display: flex;
            margin-bottom: 30px;
            border-bottom: 2px solid #eee;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            cursor: pointer;
            font-weight: bold;
            color: #999;
            transition: 0.3s;
        }
        .tab.active {
            color: #667eea;
            border-bottom: 2px solid #667eea;
        }
        .form { display: none; }
        .form.active { display: block; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
        }
        input:focus { outline: none; border-color: #667eea; }
        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover { background: #5a67d8; transform: translateY(-2px); }
        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            display: none;
        }
        .message.show { display: block; }
        .error { background: #fee; color: #c33; }
        .success { background: #efe; color: #3c3; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">💳</div>
        <h2>بوابة الدفع</h2>
        
        <div class="tabs">
            <div class="tab active" onclick="switchTab('login')">تسجيل دخول</div>
            <div class="tab" onclick="switchTab('register')">حساب جديد</div>
        </div>

        <!-- نموذج تسجيل الدخول -->
        <div id="loginForm" class="form active">
            <input type="text" id="loginUsername" placeholder="اسم المستخدم">
            <input type="password" id="loginPassword" placeholder="كلمة المرور">
            <button onclick="login()">دخول</button>
            <div id="loginMessage" class="message"></div>
        </div>

        <!-- نموذج تسجيل جديد -->
        <div id="registerForm" class="form">
            <input type="text" id="regUsername" placeholder="اسم المستخدم">
            <input type="password" id="regPassword" placeholder="كلمة المرور">
            <input type="password" id="regConfirm" placeholder="تأكيد كلمة المرور">
            <button onclick="register()">إنشاء حساب</button>
            <div id="registerMessage" class="message"></div>
        </div>
    </div>

    <script>
        // رابط السيرفر على Railway
        const API_URL = 'https://saker2-production.up.railway.app'; // غير هذا إذا كان مختلفاً
        
        function switchTab(tab) {
            document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            
            if (tab === 'login') {
                document.getElementById('loginForm').classList.add('active');
                document.querySelector('.tab').classList.add('active');
            } else {
                document.getElementById('registerForm').classList.add('active');
                document.querySelectorAll('.tab')[1].classList.add('active');
            }
        }
        
        async function login() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            const msgDiv = document.getElementById('loginMessage');
            
            if (!username || !password) {
                showMessage(msgDiv, '❌ الرجاء إدخال جميع البيانات', 'error');
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('username', data.username);
                    localStorage.setItem('isLoggedIn', 'true');
                    
                    showMessage(msgDiv, '✅ تم تسجيل الدخول... جاري التحويل', 'success');
                    setTimeout(() => {
                        window.location.href = 'payment.html';
                    }, 1000);
                } else {
                    showMessage(msgDiv, '❌ ' + data.error, 'error');
                }
            } catch (error) {
                showMessage(msgDiv, '❌ خطأ في الاتصال بالسيرفر', 'error');
            }
        }
        
        async function register() {
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regConfirm').value;
            const msgDiv = document.getElementById('registerMessage');
            
            if (!username || !password) {
                showMessage(msgDiv, '❌ الرجاء إدخال جميع البيانات', 'error');
                return;
            }
            
            if (password !== confirm) {
                showMessage(msgDiv, '❌ كلمة المرور غير متطابقة', 'error');
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/api/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showMessage(msgDiv, '✅ ' + data.message + '، يمكنك تسجيل الدخول الآن', 'success');
                    setTimeout(() => switchTab('login'), 1500);
                } else {
                    showMessage(msgDiv, '❌ ' + data.error, 'error');
                }
            } catch (error) {
                showMessage(msgDiv, '❌ خطأ في الاتصال بالسيرفر', 'error');
            }
        }
        
        function showMessage(element, text, type) {
            element.innerHTML = text;
            element.className = `message show ${type}`;
            setTimeout(() => {
                element.classList.remove('show');
            }, 3000);
        }
        
        // إذا كان مسجل دخول مسبقاً
        if (localStorage.getItem('isLoggedIn') === 'true') {
            window.location.href = 'payment.html';
        }
    </script>
</body>
</html>
