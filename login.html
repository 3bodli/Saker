<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            direction: rtl;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 400px;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background: #5a67d8;
        }
        .error {
            color: red;
            margin-top: 10px;
        }
        .success {
            color: green;
            margin-top: 10px;
        }
        .tab {
            display: flex;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            cursor: pointer;
            background: #f0f0f0;
            border: none;
            margin: 0 5px;
            border-radius: 8px;
        }
        .tab-btn.active {
            background: #667eea;
            color: white;
        }
        .form {
            display: none;
        }
        .form.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>💳 بوابة الدفع</h2>
        
        <div class="tab">
            <button class="tab-btn active" onclick="showTab('login')">تسجيل دخول</button>
            <button class="tab-btn" onclick="showTab('register')">حساب جديد</button>
        </div>
        
        <div id="loginForm" class="form active">
            <input type="text" id="loginUsername" placeholder="اسم المستخدم">
            <input type="password" id="loginPassword" placeholder="كلمة المرور">
            <button onclick="login()">دخول</button>
            <div id="loginMessage"></div>
        </div>
        
        <div id="registerForm" class="form">
            <input type="text" id="regUsername" placeholder="اسم المستخدم">
            <input type="password" id="regPassword" placeholder="كلمة المرور">
            <input type="password" id="regConfirm" placeholder="تأكيد كلمة المرور">
            <button onclick="register()">إنشاء حساب</button>
            <div id="registerMessage"></div>
        </div>
    </div>

    <script>
        const API_URL = 'https://saker2-production.up.railway.app';
        
        function showTab(tab) {
            document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            if (tab === 'login') {
                document.getElementById('loginForm').classList.add('active');
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
            } else {
                document.getElementById('registerForm').classList.add('active');
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
            }
        }
        
        async function login() {
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            const msgDiv = document.getElementById('loginMessage');
            
            if (!username || !password) {
                msgDiv.innerHTML = '<div class="error">❌ أدخل جميع البيانات</div>';
                return;
            }
            
            msgDiv.innerHTML = '<div>⏳ جاري...</div>';
            
            try {
                const response = await fetch(`${API_URL}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                console.log('Response:', data);
                
                if (data.success) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('username', data.username);
                    msgDiv.innerHTML = '<div class="success">✅ تم تسجيل الدخول! جاري التحويل...</div>';
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                } else {
                    msgDiv.innerHTML = '<div class="error">❌ ' + data.error + '</div>';
                }
            } catch (error) {
                msgDiv.innerHTML = '<div class="error">❌ خطأ: ' + error.message + '</div>';
            }
        }
        
        async function register() {
            const username = document.getElementById('regUsername').value;
            const password = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regConfirm').value;
            const msgDiv = document.getElementById('registerMessage');
            
            if (!username || !password) {
                msgDiv.innerHTML = '<div class="error">❌ أدخل جميع البيانات</div>';
                return;
            }
            
            if (password !== confirm) {
                msgDiv.innerHTML = '<div class="error">❌ كلمة المرور غير متطابقة</div>';
                return;
            }
            
            msgDiv.innerHTML = '<div>⏳ جاري...</div>';
            
            try {
                const response = await fetch(`${API_URL}/api/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                console.log('Response:', data);
                
                if (data.success) {
                    msgDiv.innerHTML = '<div class="success">✅ ' + data.message + '</div>';
                    setTimeout(() => showTab('login'), 1500);
                } else {
                    msgDiv.innerHTML = '<div class="error">❌ ' + data.error + '</div>';
                }
            } catch (error) {
                msgDiv.innerHTML = '<div class="error">❌ خطأ: ' + error.message + '</div>';
            }
        }
        
        // إذا كان مسجل دخول مسبقاً
        if (localStorage.getItem('token')) {
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
