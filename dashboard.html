<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الرئيسية - بوابة التحويلات</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Tahoma', sans-serif;
            background: linear-gradient(145deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            width: 100%;
        }
        .card {
            background: white;
            border-radius: 40px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.3);
        }
        .user-bar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 60px;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            color: white;
        }
        .logout-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 8px 20px;
            border-radius: 40px;
            cursor: pointer;
        }
        .welcome {
            font-size: 24px;
            margin-bottom: 30px;
            color: #333;
        }
        .button-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 20px;
        }
        .main-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 25px;
            border-radius: 30px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .main-btn:hover {
            transform: scale(1.02);
        }
        .main-btn.secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        .admin-btn {
            background: #ffc107;
            color: #333;
            margin-top: 20px;
            padding: 12px;
            border-radius: 30px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="user-bar">
                <span>👋 <span id="usernameDisplay"></span></span>
                <button class="logout-btn" onclick="logout()">🚪 خروج</button>
            </div>
            
            <div class="welcome">💫 مرحباً بك في بوابة التحويلات</div>
            
            <div class="button-grid">
                <button class="main-btn" onclick="window.location.href='transfer-to-me.html'">
                    💸 تحويل لي
                </button>
                <button class="main-btn secondary" onclick="window.location.href='transfer-company.html'">
                    🏦 تحويل لشركات الصرافة
                </button>
            </div>
            
            <div id="adminPanel" style="display: none;">
                <button class="admin-btn" onclick="window.location.href='admin.html'">
                    👑 لوحة التحكم - إدارة الطلبات
                </button>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const username = localStorage.getItem('username');
        const role = localStorage.getItem('role');
        
        if (!token) {
            window.location.href = 'login.html';
        }
        
        document.getElementById('usernameDisplay').innerText = username;
        
        if (role === 'admin') {
            document.getElementById('adminPanel').style.display = 'block';
        }
        
        function logout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
