<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شركات الصرافة - بوابة التحويلات</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Tahoma', sans-serif;
            background: linear-gradient(145deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: auto;
        }
        .card {
            background: white;
            border-radius: 40px;
            padding: 30px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.3);
        }
        .back-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            margin-bottom: 20px;
            color: #667eea;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }
        .search-box {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            border: 2px solid #e0e0e0;
            border-radius: 30px;
            font-size: 16px;
        }
        .companies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            max-height: 500px;
            overflow-y: auto;
            padding: 5px;
        }
        .company-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 20px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        .company-card:hover {
            transform: translateY(-5px);
            border-color: #667eea;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .company-img {
            font-size: 50px;
            margin-bottom: 10px;
        }
        .company-img img {
            width: 60px;
            height: 60px;
            object-fit: contain;
        }
        .company-name {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 5px;
        }
        .company-fee {
            font-size: 11px;
            color: #666;
        }
        .no-results {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <button class="back-btn" onclick="window.location.href='dashboard.html'">← رجوع</button>
            <h2>🏦 اختر شركة الصرافة</h2>
            
            <input type="text" class="search-box" id="searchInput" placeholder="🔍 بحث عن شركة...">
            
            <div class="companies-grid" id="companiesGrid"></div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        
        if (!token) {
            window.location.href = 'login.html';
        }
        
        // ========== قائمة الـ 26 شركة ==========
        const companies = [
            { id: 1, name: "البريد السوري", image: "img1", fee: 7, receiverName: "", receiverNumber: "" },
            { id: 2, name: "الهرم للحوالات", image: "img2", fee: 7, receiverName: "", receiverNumber: "" },
            { id: 3, name: "الفؤاد للحوالات", image: "img3", fee: 7, receiverName: "", receiverNumber: "" },
            { id: 4, name: "شركة شخاشيرو", image: "img4", fee: 7, receiverName: "", receiverNumber: "" },
            { id: 5, name: "شركة شام للحوالات", image: "img5", fee: 7, receiverName: "", receiverNumber: "" },
            { id: 6, name: "زمزم للصرافة", image: "img6", fee: 7, receiverName: "", receiverNumber: "" },
            { id: 7, name: "تايغر للصرافة", image: "img7", fee: 7, receiverName: "", receiverNumber: "" },
            { id: 8, name: "ياقوت بلس للصرافة", image: "img8", fee: 7, receiverName: "", receiverNumber: "" },
            { id: 9, name: "دوفيز للحوالات", image: "img9", fee: 7, receiverName: "", receiverNumber: "" },
            { id: 10, name: "الاتحاد للحوالات", image: "img10", fee: 7, receiverName: "", receiverNumber: "" },
            { id: 11, name: "روديوم للصرافة", image: "img11", fee: 7, receiverName: "", receiverNumber: "" },
            { id: 12, name: "شركة طيف للصرافة", image: "img12", fee: 7, receiverName: "", receiverNumber: "" },
            { id: 13, name: "موني اوت للصرافة", image: "img13", fee: 7, receiverName: "", receiverNumber: "" },
            { id: 14, name: "مسار للصرافة", image: "img14", fee: 7, receiverName: "", receiverNumber: "" },
            { id: 15, name: "تيما للصرافة", image: "img15", fee: 7, receiverName: "", receiverNumber: "" },
            { id: 16, name: "قاسيون للصرافة", image: "img16", fee: 7, receiverName: "", receiverNumber: "" },
            { id: 17, name: "الميثاق", image: "img17", fee: 7, receiverName: "", receiverNumber: "" },
            { id: 18, name: "الحافظ للصرافة", image: "img18", fee: 7, receiverName: "", receiverNumber: "" },
            { id: 19, name: "الاندلس", image: "img19", fee: 7, receiverName: "", receiverNumber: "" },
            { id: 20, name: "سوريانا", image: "img20", fee: 7, receiverName: "", receiverNumber: "" },
            { id: 21, name: "دار الامل للصرافة", image: "img21", fee: 7, receiverName: "", receiverNumber: "" },
            { id: 22, name: "صافي للصرافة", image: "img22", fee: 7, receiverName: "", receiverNumber: "" },
            { id: 23, name: "الخواجا للصرافة", image: "img23", fee: 7, receiverName: "", receiverNumber: "" },
            { id: 24, name: "دهب للصرافة", image: "img24", fee: 7, receiverName: "", receiverNumber: "" },
            { id: 25, name: "كابيتال", image: "img25", fee: 7, receiverName: "", receiverNumber: "" },
            { id: 26, name: "شركة اتحاد", image: "img26", fee: 7, receiverName: "", receiverNumber: "" }
        ];
        
        const grid = document.getElementById('companiesGrid');
        const searchInput = document.getElementById('searchInput');
        
        // عرض الشركات
        function displayCompanies(filteredCompanies) {
            grid.innerHTML = '';
            
            if (filteredCompanies.length === 0) {
                grid.innerHTML = '<div class="no-results">❌ لا توجد شركات مطابقة للبحث</div>';
                return;
            }
            
            filteredCompanies.forEach(company => {
                const card = document.createElement('div');
                card.className = 'company-card';
                card.innerHTML = `
                    <div class="company-img">
                        <img src="images/${company.image}.png" 
                             onerror="this.src='https://placehold.co/60x60?text=${company.image}'" 
                             alt="${company.name}">
                    </div>
                    <div class="company-name">${company.name}</div>
                    <div class="company-fee">💰 رسوم: ${company.fee}%</div>
                `;
                card.onclick = () => {
                    localStorage.setItem('selectedCompany', JSON.stringify(company));
                    window.location.href = 'company-payment.html';
                };
                grid.appendChild(card);
            });
        }
        
        // البحث
        searchInput.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const filtered = companies.filter(company => 
                company.name.toLowerCase().includes(searchTerm)
            );
            displayCompanies(filtered);
        });
        
        // عرض الكل
        displayCompanies(companies);
    </script>
</body>
</html>
