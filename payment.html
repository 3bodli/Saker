<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>صفحة الدفع</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            direction: rtl;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            width: 400px;
            text-align: center;
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 10px;
            font-size: 16px;
        }
        button {
            background: #28a745;
            color: white;
            border: none;
            cursor: pointer;
        }
        .logout {
            background: #dc3545;
        }
        .error { color: red; }
        .success { color: green; }
        .message { margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>💳 بوابة الدفع</h2>
        <div id="userInfo"></div>
        
        <input type="number" id="amount" placeholder="المبلغ بالدولار" min="1">
        
        <button onclick="createPayment()">💸 إتمام الدفع</button>
        <button class="logout" onclick="logout()">🚪 تسجيل خروج</button>
        
        <div id="message"></div>
    </div>

    <script>
        const API_URL = 'https://saker2-production.up.railway.app';
        
        // التحقق من التوكن عند تحميل الصفحة
        const token = localStorage.getItem('token');
        const username = localStorage.getItem('username');
        
        if (!token) {
            window.location.href = 'login.html';
        }
        
        document.getElementById('userInfo').innerHTML = `👋 مرحباً ${username || 'مستخدم'}`;
        
        async function createPayment() {
            const amount = document.getElementById('amount').value;
            const msgDiv = document.getElementById('message');
            const btn = event.target;
            
            if (!amount || amount < 1) {
                msgDiv.innerHTML = '<span class="error">❌ أدخل مبلغ صحيح</span>';
                return;
            }
            
            msgDiv.innerHTML = '<span>⏳ جاري...</span>';
            btn.disabled = true;
            
            try {
                const response = await fetch(`${API_URL}/create-payment`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ amount: parseFloat(amount), pay_currency: 'btc' })
                });
                
                // إذا كان التوكن غير صالح
                if (response.status === 401) {
                    msgDiv.innerHTML = '<span class="error">⚠️ انتهت صلاحية الجلسة، جاري إعادة التوجيه...</span>';
                    setTimeout(() => logout(), 2000);
                    return;
                }
                
                const data = await response.json();
                
                if (data.success && data.paymentUrl) {
                    msgDiv.innerHTML = '<span class="success">✅ تم إنشاء الدفع! جاري التحويل...</span>';
                    setTimeout(() => window.open(data.paymentUrl, '_blank'), 1000);
                } else {
                    msgDiv.innerHTML = `<span class="error">❌ ${data.error || 'فشل الدفع'}</span>`;
                }
                
            } catch (error) {
                msgDiv.innerHTML = `<span class="error">❌ خطأ: ${error.message}</span>`;
            } finally {
                btn.disabled = false;
            }
        }
        
        function logout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
