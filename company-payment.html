<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحويل لشركة صرافة</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Tahoma', sans-serif;
            background: linear-gradient(145deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: auto;
        }
        .card {
            background: white;
            border-radius: 40px;
            padding: 30px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.3);
        }
        .back-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            margin-bottom: 20px;
            color: #667eea;
        }
        .company-info {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 30px;
            text-align: center;
            margin-bottom: 25px;
        }
        .company-info img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            margin-bottom: 10px;
        }
        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }
        input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 2px solid #e0e0e0;
            border-radius: 20px;
            font-size: 16px;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        .info-box {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 20px;
            margin: 15px 0;
            text-align: center;
        }
        .final-amount {
            font-size: 24px;
            font-weight: bold;
            color: #2e7d32;
        }
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #28a745 0%, #1e7e34 100%);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 15px;
            text-align: center;
        }
        .error { background: #fee; color: #c33; }
        .success { background: #efe; color: #2e7d32; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <button class="back-btn" onclick="window.location.href='transfer-company.html'">← رجوع</button>
            
            <div id="companyInfo" class="company-info"></div>
            
            <h2>💸 بيانات التحويل</h2>
            
            <input type="text" id="receiverName" placeholder="اسم المستقبل">
            <input type="text" id="receiverNumber" placeholder="رقم الهاتف / الحساب">
            <input type="number" id="amount" placeholder="المبلغ بالدولار" step="1" min="1">
            
            <div id="feeInfo" class="info-box"></div>
            
            <button onclick="createTransfer()">📤 متابعة إلى الدفع</button>
            <div id="message"></div>
        </div>
    </div>

    <script>
        const API_URL = 'https://saker2-production.up.railway.app';
        const token = localStorage.getItem('token');
        const company = JSON.parse(localStorage.getItem('selectedCompany') || '{}');
        
        if (!token) {
            window.location.href = 'login.html';
        }
        
        if (!company.name) {
            window.location.href = 'transfer-company.html';
        }
        
        // عرض معلومات الشركة
        document.getElementById('companyInfo').innerHTML = `
            <img src="images/${company.image}.png" onerror="this.src='https://placehold.co/60x60?text=${company.image}'">
            <h3>${company.name}</h3>
            <p>💰 رسوم التحويل: ${company.fee}%</p>
        `;
        
        // حساب الرسوم المباشر
        const amountInput = document.getElementById('amount');
        const feeInfo = document.getElementById('feeInfo');
        
        function updateFee() {
            const amount = parseFloat(amountInput.value) || 0;
            const feePercent = company.fee || 5;
            const fee = amount * (feePercent / 100);
            const finalAmount = amount - fee;
            
            feeInfo.innerHTML = `
                <div>💵 المبلغ المرسل: $${amount}</div>
                <div>📉 رسوم ${feePercent}%: $${fee.toFixed(2)}</div>
                <div class="final-amount">💰 سيتم استلام: $${finalAmount.toFixed(2)}</div>
            `;
        }
        
        amountInput.addEventListener('input', updateFee);
        updateFee();
        
        async function createTransfer() {
            const receiverName = document.getElementById('receiverName').value;
            const receiverNumber = document.getElementById('receiverNumber').value;
            const amount = document.getElementById('amount').value;
            const msgDiv = document.getElementById('message');
            
            if (!receiverName || !receiverNumber || !amount || amount < 1) {
                msgDiv.innerHTML = '<div class="message error">❌ أدخل جميع البيانات</div>';
                return;
            }
            
            const feePercent = company.fee || 5;
            const finalAmount = amount * (1 - feePercent / 100);
            
            msgDiv.innerHTML = '<div class="message">⏳ جاري إنشاء الطلب...</div>';
            
            try {
                const response = await fetch(`${API_URL}/api/create-company-transfer`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        companyName: company.name,
                        receiverName,
                        receiverNumber,
                        amount: parseFloat(amount)
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    localStorage.setItem('currentTransferId', data.transferId);
                    localStorage.setItem('currentAmount', amount);
                    localStorage.setItem('finalAmount', data.finalAmount);
                    window.location.href = 'payment.html';
                } else {
                    msgDiv.innerHTML = `<div class="message error">❌ ${data.error}</div>`;
                }
            } catch (error) {
                msgDiv.innerHTML = '<div class="message error">❌ فشل الاتصال بالخادم</div>';
            }
        }
    </script>
</body>
</html>
